# ==============================================================
# Render Infrastructure as Code (Blueprint)
# Automatically deploys Full Stack Support Ticket System
# ==============================================================

services:
  # 1. Backend REST API Web Service
  - type: web
    name: support-ticket-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        value: 4SFKuoyHoMbvyUB.root
      - key: DB_PASSWORD
        value: ZD3P0Is6n5S4Gh6u
      - key: DB_NAME
        value: support_ticket_db
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        value: super_secret_jwt_ticket_prod_key_7788
      - key: CLIENT_URL
        value: "*"

  # 2. Frontend React Web Application
  - type: web
    name: support-ticket-portal
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://support-ticket-api.onrender.com/api
