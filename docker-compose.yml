version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ticket_system_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: support_ticket_db
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket_system_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password123
      DB_NAME: support_ticket_db
      JWT_SECRET: production_super_jwt_secret_token_key_7788
      JWT_EXPIRES_IN: 24h
      CLIENT_URL: http://localhost:80
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket_system_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  db_data:
